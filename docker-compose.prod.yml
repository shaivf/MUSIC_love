version: '3.8'

# 生产环境 Docker Compose 配置 (扩展配置)
# 用法: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  database:
    # 数据库持久化和备份备份策略
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups  # 备份目录
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '1'
          memory: 512M
    
    # 日志大小限制
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    # 多副本配置
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
    
    # 日志
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # 环境变量优化
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"

  frontend:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # 可选：Nginx 反向代理
  nginx-proxy:
    image: nginx:alpine
    container_name: music_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - music_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      timeout: 10s
      retries: 5
      interval: 10s

  # 可选：自动化备份服务
  backup:
    image: mysql:8.0
    container_name: music_backup
    command: |
      bash -c 'while true; do
        mysqldump -h database -u $$DB_USER -p$$DB_PASSWORD $$DB_NAME > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql;
        find /backups -name "backup-*.sql" -mtime +7 -delete;
        sleep 86400;
      done'
    depends_on:
      - database
    volumes:
      - ./backups:/backups
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - music_network
    restart: unless-stopped

  # 可选：监控和日志收集 (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: music_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - music_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
    driver: local

networks:
  music_network:
    driver: bridge
